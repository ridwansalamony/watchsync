services:
  realtime:
    image: ${REALTIME_IMAGE:-watchsync-realtime:local}
    build:
      context: ..
      dockerfile: realtime/Dockerfile
    env_file: .env.production
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    mem_limit: 600m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      REALTIME_DOMAIN: ${REALTIME_DOMAIN:?Isi domain server realtime}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      realtime:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
